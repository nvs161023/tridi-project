# Klipper: START_PRINT, END_PRINT, PAUSE, RESUME и M600
#
# Куда вставить
#   Скопируйте нужные секции в printer.cfg или положите файл рядом
#   и подключите строкой [include klipper-macros.cfg].
#
# Что должно быть в printer.cfg
#   [pause_resume]        — без него не работают PAUSE, RESUME и CLEAR_PAUSE.
#   [virtual_sdcard]      — нужен для обычной печати с SD-карты.
#   [bed_mesh]            — необязательно; см. строку в START_PRINT.
#
# Перед первым запуском
#   1. Удалите другие секции [gcode_macro PAUSE] и [gcode_macro RESUME]:
#      два макроса с одним именем Klipper не загрузит.
#   2. Проверьте парковку: X=50, Y=50 — свободный угол вашего стола.
#   3. Проверьте подъём Z=10: он не должен упираться в верхнюю границу.
#   4. Прогоните START_PRINT без пластика и убедитесь, что оси не задевают зажимы.
#   5. Горячее сопло не оставляйте без присмотра.
#
# Вызов из слайсера (поддерживаются оба имени параметров):
#   START_PRINT BED=60 EXTRUDER=210
#   START_PRINT BED_TEMP=60 EXTRUDER_TEMP=210
#   M600
#   PAUSE
#   RESUME
#
# Это шаблон под конкретный принтер, а не универсальная прошивка.
# Если принтер сам делает G28 в макросе homing_override, уберите G28 ниже.

[gcode_macro START_PRINT]
description: Старт печати: прогрев, парковка и прайм-линия
gcode:
    {% set BED = params.BED|default(params.BED_TEMP)|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(params.EXTRUDER_TEMP)|default(210)|float %}
    {% set PRIME_Y = params.PRIME_Y|default(100)|float %}
    CLEAR_PAUSE
    G90
    M82
    G28
    M140 S{BED}
    M104 S{EXTRUDER * 0.7}
    M190 S{BED}
    # Если в printer.cfg есть [bed_mesh], раскомментируйте строку ниже.
    # BED_MESH_CALIBRATE
    M109 S{EXTRUDER}
    G92 E0
    G1 Z5 F600
    G1 X5 Y5 F6000
    G1 Z0.3 F600
    G1 X5 Y{PRIME_Y} E12 F1200
    G1 X5 Y5 E24 F1200
    G92 E0
    G1 Z2 F600
    M117 Printing

[gcode_macro END_PRINT]
description: Финал печати: снять нагрев, отвести сопло, выключить моторы
gcode:
    M400
    M104 S0
    M140 S0
    M106 S0
    G91
    G1 E-2 F2700
    G1 Z10 F900
    G90
    G1 X5 Y{printer.toolhead.axis_maximum.y|float - 5} F6000
    M84
    M117 Print complete

[gcode_macro PAUSE]
description: Пауза с сохранением позиции и безопасным отводом
rename_existing: BASE_PAUSE
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(50)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% if printer.pause_resume.is_paused %}
        RESPOND PREFIX=warn MSG="Print is already paused"
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_state
        BASE_PAUSE
        G91
        G1 E-2 F2700
        G1 Z{Z} F900
        G90
        G1 X{X} Y{Y} F6000
        M117 Paused
    {% endif %}

[gcode_macro RESUME]
description: Продолжение печати из сохранённой позиции
rename_existing: BASE_RESUME
gcode:
    {% if printer.pause_resume.is_paused %}
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
        G91
        G1 E2 F2100
        G90
        BASE_RESUME
        M117 Printing
    {% else %}
        RESPOND PREFIX=warn MSG="Print is not paused"
    {% endif %}

[gcode_macro M600]
description: Смена пластика в середине печати
gcode:
    RESPOND PREFIX=info MSG="M600: change filament, purge, then run RESUME"
    PAUSE
    M117 Change filament
