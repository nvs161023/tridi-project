<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Восстановление пароля</title></head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding:20px;">
<div style="max-width:600px; margin:0 auto; background:#fff; border-radius:8px; padding:30px;">

<h2 style="color:#333;">Восстановление пароля</h2>

<p style="color:#555; font-size:16px;">Вы запросили восстановление пароля на сайте <strong>Tridi Print</strong>.</p>

<p style="color:#555; font-size:16px;">Нажмите кнопку ниже, чтобы задать новый пароль.</p>

<p style="text-align:center; margin:30px 0;">
<a href="{{ .SiteURL }}/auth/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="background:#2563eb; color:#fff; padding:14px 28px; text-decoration:none; border-radius:6px; font-size:16px; display:inline-block;">Сбросить пароль</a>
</p>

<hr style="border:none; border-top:1px solid #eee; margin:30px 0;">

<p style="color:#999; font-size:12px;">Если вы не запрашивали восстановление пароля, просто проигнорируйте это письмо.</p>

</div>
</body>
</html>
