<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="64" y="70" font-size="17" font-weight="bold" fill="#e2e8f0">Как работает ретракт</text>
  <text x="64" y="96" font-size="13" fill="#94a3b8">сопло переезжает между деталями и втягивает пластик назад, чтобы он не капал</text>

  <!-- стол -->
  <rect x="120" y="336" width="560" height="16" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- две башни -->
  <rect x="176" y="246" width="64" height="90" rx="8" fill="#2563eb" opacity="0.9"/>
  <rect x="560" y="246" width="64" height="90" rx="8" fill="#2563eb" opacity="0.9"/>

  <!-- нити между деталями -->
  <g stroke="#f87171" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.32;0.42;0.86;0.94;1" dur="4s" repeatCount="indefinite"/>
    <path d="M240 258 L560 264"/>
    <path d="M240 274 L560 288"/>
    <path d="M240 292 L560 306"/>
  </g>

  <!-- сопло с втягиванием пластика -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 320 0; 320 0; 0 0" keyTimes="0;0.4;0.62;1" dur="4s" repeatCount="indefinite"/>
    <rect x="226" y="206" width="28" height="14" rx="4" fill="#94a3b8"/>
    <path d="M232 220h16l-5 20h-6z" fill="#cbd5e1"/>
    <rect x="236" y="166" width="7" height="52" rx="3.5" fill="#38bdf8">
      <animate attributeName="height" values="52;16;52" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="166;202;166" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="239" cy="242" r="12" fill="#f59e0b" opacity="0.18"/>
    <path d="M258 224 L258 200" stroke="#fbbf24" stroke-width="3"/>
    <path d="M252 206 L258 198 L264 206" fill="none" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <text x="298" y="192" font-size="13" fill="#fbbf24">пластик втягивается на 1–2 мм</text>

  <g font-size="13" fill="#94a3b8">
    <text x="64" y="392">Мало ретракта — между деталями остаются нити.</text>
    <text x="64" y="414">Слишком много — пластик застревает и сопло забивается.</text>
  </g>
  <text x="736" y="404" text-anchor="end" font-size="13" fill="#38bdf8">для PLA: 5–7 мм</text>
</svg>
