<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 0 % -->
  <rect x="40" y="40" width="150" height="170" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="52" y="52" width="126" height="146" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="115" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#e2e8f0">0 %</text>
  <text x="115" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">пусто внутри</text>
  <text x="115" y="292" text-anchor="middle" font-size="12" fill="#64748b">декор</text>

  <!-- 15 % -->
  <rect x="230" y="40" width="150" height="170" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <g stroke="#38bdf8" stroke-width="3" opacity="0.95">
    <path d="M280 46v158M330 46v158M245 90h120M245 140h120M245 190h120"/>
  </g>
  <text x="305" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#38bdf8">15 %</text>
  <text x="305" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">редкая решётка</text>
  <text x="305" y="292" text-anchor="middle" font-size="12" fill="#64748b">игрушки, декор</text>

  <!-- 40 % -->
  <rect x="420" y="40" width="150" height="170" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <g stroke="#38bdf8" stroke-width="3.4" opacity="0.95">
    <path d="M255 46v158M285 46v158M315 46v158M345 46v158M435 46v158M465 46v158M495 46v158M525 46v158"/>
    <path d="M430 70h130M430 100h130M430 130h130M430 160h130M430 190h130"/>
  </g>
  <text x="495" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#38bdf8">40 %</text>
  <text x="495" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">плотная решётка</text>
  <text x="495" y="292" text-anchor="middle" font-size="12" fill="#64748b">рабочие детали</text>

  <!-- 100 % -->
  <rect x="610" y="40" width="150" height="170" rx="14" fill="#2563eb" stroke="#3b82f6" stroke-width="3"/>
  <g stroke="#0b1220" stroke-width="1.6" opacity="0.28">
    <path d="M610 70h150M610 100h150M610 130h150M610 160h150M610 190h150"/>
  </g>
  <text x="685" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#e2e8f0">100 %</text>
  <text x="685" y="272" text-anchor="middle" font-size="12" fill="#94a3b8">сплошной пластик</text>
  <text x="685" y="292" text-anchor="middle" font-size="12" fill="#64748b">технические детали</text>

  <text x="40" y="344" font-size="14" fill="#cbd5e1">Заполнение — это решётка внутри детали: она держит форму и экономит пластик.</text>
  <text x="40" y="374" font-size="13" fill="#64748b">Для первой печати достаточно 20 % и трёх стенок. 100 % нужно редко —</text>
  <text x="40" y="396" font-size="13" fill="#64748b">чаще важнее толщина стенок.</text>
</svg>
