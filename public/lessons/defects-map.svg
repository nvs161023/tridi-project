<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <g fill="#0f172a" stroke="#1e293b" stroke-width="2">
    <rect x="16" y="20" width="144" height="176" rx="14"/>
    <rect x="172" y="20" width="144" height="176" rx="14"/>
    <rect x="328" y="20" width="144" height="176" rx="14"/>
    <rect x="484" y="20" width="144" height="176" rx="14"/>
    <rect x="640" y="20" width="144" height="176" rx="14"/>
    <rect x="16" y="208" width="144" height="176" rx="14"/>
    <rect x="172" y="208" width="144" height="176" rx="14"/>
    <rect x="328" y="208" width="144" height="176" rx="14"/>
    <rect x="484" y="208" width="144" height="176" rx="14"/>
    <rect x="640" y="208" width="144" height="176" rx="14"/>
  </g>

  <g font-size="12.5" fill="#cbd5e1" text-anchor="middle">
    <text x="88" y="48">не прилипло</text>
    <text x="244" y="48">паутинки</text>
    <text x="400" y="48">слои не склеены</text>
    <text x="556" y="48">свисает</text>
    <text x="712" y="48">волны</text>
    <text x="88" y="236">пропуски</text>
    <text x="244" y="236">трещины</text>
    <text x="400" y="236">неровные углы</text>
    <text x="556" y="236">1-й слой тонкий</text>
    <text x="712" y="236">1-й слой толстый</text>
  </g>

  <!-- 1. не прилипло -->
  <g transform="translate(16,20)">
    <rect x="20" y="140" width="104" height="10" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M40 138 C40 116 70 122 86 100" fill="none" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <path d="M104 118 L104 134" stroke="#fbbf24" stroke-width="3"/>
    <path d="M98 128 L104 136 L110 128" fill="none" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- 2. паутинки -->
  <g transform="translate(172,20)">
    <rect x="30" y="66" width="16" height="84" rx="4" fill="#2563eb"/>
    <rect x="98" y="66" width="16" height="84" rx="4" fill="#2563eb"/>
    <g stroke="#94a3b8" stroke-width="1.4" opacity="0.85">
      <path d="M46 84 L98 112M46 104 L98 92M46 124 L98 132M46 140 L98 106"/>
    </g>
  </g>

  <!-- 3. слои не склеены -->
  <g transform="translate(328,20)">
    <g fill="#38bdf8">
      <rect x="24" y="58" width="96" height="8" rx="3"/>
      <rect x="24" y="76" width="96" height="8" rx="3"/>
      <rect x="24" y="94" width="96" height="8" rx="3"/>
      <rect x="24" y="112" width="96" height="8" rx="3"/>
      <rect x="24" y="130" width="96" height="8" rx="3"/>
    </g>
    <path d="M132 72 L132 138" stroke="#f87171" stroke-width="3"/>
    <path d="M126 78 L132 70 L138 78" fill="none" stroke="#f87171" stroke-width="3"/>
    <path d="M126 132 L132 140 L138 132" fill="none" stroke="#f87171" stroke-width="3"/>
  </g>
  <!-- 4. свисает -->
  <g transform="translate(484,20)">
    <rect x="34" y="56" width="76" height="40" rx="4" fill="#38bdf8" opacity="0.9"/>
    <path d="M34 96 C34 136 62 146 100 144" fill="#38bdf8" opacity="0.75"/>
    <path d="M104 150 L104 166" stroke="#f87171" stroke-width="3"/>
    <path d="M98 160 L104 168 L110 160" fill="none" stroke="#f87171" stroke-width="3"/>
  </g>

  <!-- 5. волны -->
  <g transform="translate(640,20)">
    <path d="M20 104 q12 -16 24 0 t24 0 t24 0 t24 0" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <path d="M20 124 q12 -16 24 0 t24 0 t24 0 t24 0" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <rect x="18" y="140" width="108" height="10" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- 6. пропуски -->
  <g transform="translate(16,208)">
    <g fill="#38bdf8">
      <rect x="24" y="70" width="30" height="10" rx="3"/>
      <rect x="62" y="70" width="24" height="10" rx="3"/>
      <rect x="96" y="70" width="24" height="10" rx="3"/>
      <rect x="24" y="96" width="96" height="10" rx="3"/>
      <rect x="24" y="122" width="52" height="10" rx="3"/>
      <rect x="86" y="122" width="34" height="10" rx="3"/>
    </g>
    <circle cx="52" cy="75" r="10" fill="none" stroke="#f87171" stroke-width="2"/>
  </g>

  <!-- 7. трещины -->
  <g transform="translate(172,208)">
    <rect x="34" y="56" width="76" height="96" rx="6" fill="#2563eb" opacity="0.9"/>
    <path d="M72 56 L66 84 L80 104 L70 132 L76 152" fill="none" stroke="#070c17" stroke-width="3.5"/>
  </g>

  <!-- 8. неровные углы -->
  <g transform="translate(328,208)">
    <rect x="38" y="56" width="72" height="96" rx="20" fill="#38bdf8"/>
    <circle cx="38" cy="104" r="16" fill="#38bdf8"/>
    <circle cx="110" cy="104" r="16" fill="#38bdf8"/>
    <path d="M126 90 L126 118" stroke="#f87171" stroke-width="3"/>
    <path d="M120 96 L126 88 L132 96" fill="none" stroke="#f87171" stroke-width="3"/>
    <path d="M120 112 L126 120 L132 112" fill="none" stroke="#f87171" stroke-width="3"/>
  </g>

  <!-- 9. первый слой тонкий -->
  <g transform="translate(484,208)">
    <rect x="34" y="56" width="76" height="72" rx="6" fill="#2563eb" opacity="0.85"/>
    <g fill="#f59e0b">
      <rect x="28" y="130" width="30" height="5" rx="2"/>
      <rect x="62" y="130" width="30" height="5" rx="2"/>
      <rect x="96" y="130" width="20" height="5" rx="2"/>
    </g>
    <rect x="20" y="140" width="104" height="10" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- 10. первый слой толстый -->
  <g transform="translate(640,208)">
    <rect x="34" y="56" width="76" height="68" rx="6" fill="#2563eb" opacity="0.85"/>
    <rect x="26" y="124" width="42" height="16" rx="7" fill="#f87171"/>
    <rect x="70" y="124" width="42" height="16" rx="7" fill="#f87171"/>
    <rect x="20" y="140" width="104" height="10" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>

  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#64748b">Сохрани эту карту: сравни свой брак с картинками и исправляй по одной настройке</text>
</svg>
