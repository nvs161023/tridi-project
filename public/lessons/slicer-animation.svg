<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- подписи шагов -->
  <g font-size="14" fill="#cbd5e1">
    <circle cx="66" cy="150" r="14" fill="#2563eb"/>
    <text x="66" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="92" y="155">Модель готова</text>

    <circle cx="66" cy="212" r="14" fill="#2563eb"/>
    <text x="66" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="92" y="217">Слайсер режет её на слои</text>

    <circle cx="66" cy="274" r="14" fill="#2563eb"/>
    <text x="66" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="92" y="279">Каждый слой — команды для принтера</text>
  </g>

  <!-- модель, разбирающаяся на слои -->
  <g>
    <g transform="translate(0,0)"><rect x="300" y="120" width="240" height="20" rx="3" fill="#2563eb" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="140" width="240" height="20" rx="3" fill="#2a6ff0" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="160" width="240" height="20" rx="3" fill="#2f7cf4" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 20; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="180" width="240" height="20" rx="3" fill="#3489f7" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 30; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="200" width="240" height="20" rx="3" fill="#3a96fa" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 40; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="220" width="240" height="20" rx="3" fill="#3fa3fc" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 50; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="240" width="240" height="20" rx="3" fill="#44b0fe" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 60; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="260" width="240" height="20" rx="3" fill="#4ab8ff" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 70; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <g><rect x="300" y="280" width="240" height="20" rx="3" fill="#50c0ff" stroke="#070c17" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0; 0 80; 0 0" dur="4s" repeatCount="indefinite"/></g>
    <rect x="300" y="120" width="240" height="180" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- плоскость реза -->
  <rect x="284" y="110" width="272" height="5" rx="2.5" fill="#38bdf8" opacity="0.9">
    <animate attributeName="y" values="112;298;112" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- сопло, обегающее слои -->
  <circle r="8" fill="#e2e8f0">
    <animate attributeName="cx" values="300;540;300" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="116;296;116" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="580" y="150" font-size="13" fill="#94a3b8">траектория сопла</text>
  <path d="M548 156 L534 172" stroke="#475569" stroke-width="2"/>

  <text x="420" y="392" text-anchor="middle" font-size="13" fill="#64748b">слои расходятся, чтобы было видно нарезку</text>
</svg>
