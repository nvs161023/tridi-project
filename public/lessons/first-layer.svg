<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- хороший слой -->
  <rect x="40" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#10b981" stroke-width="2"/>
  <text x="64" y="86" font-size="19" font-weight="bold" fill="#34d399">Хороший первый слой</text>
  <g fill="#34d399">
    <rect x="64" y="214" width="42" height="14" rx="4"/>
    <rect x="106" y="214" width="42" height="14" rx="4"/>
    <rect x="148" y="214" width="42" height="14" rx="4"/>
    <rect x="190" y="214" width="42" height="14" rx="4"/>
    <rect x="232" y="214" width="42" height="14" rx="4"/>
    <rect x="274" y="214" width="42" height="14" rx="4"/>
    <rect x="316" y="214" width="42" height="14" rx="4"/>
  </g>
  <g stroke="#0b1220" stroke-width="1.4" opacity="0.35">
    <path d="M106 214v14M148 214v14M190 214v14M232 214v14M274 214v14M316 214v14"/>
  </g>
  <rect x="64" y="228" width="294" height="14" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="361" y="268" text-anchor="end" font-size="12" fill="#64748b">стол</text>

  <!-- сопло рядом -->
  <rect x="176" y="176" width="28" height="14" rx="4" fill="#94a3b8"/>
  <path d="M182 190h16l-5 14h-6z" fill="#cbd5e1"/>

  <g font-size="14" fill="#a7f3d0">
    <text x="64" y="320">• линии ложатся ровно</text>
    <text x="64" y="346">• пластик слипся, щелей нет</text>
    <text x="64" y="372">• модель крепко держится</text>
  </g>

  <!-- плохой слой -->
  <rect x="415" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#f87171" stroke-width="2"/>
  <text x="439" y="86" font-size="19" font-weight="bold" fill="#f87171">Плохой первый слой</text>
  <g fill="#f87171">
    <rect x="439" y="212" width="30" height="14" rx="4"/>
    <rect x="487" y="205" width="30" height="12" rx="4"/>
    <rect x="535" y="218" width="30" height="10" rx="4"/>
    <rect x="583" y="198" width="30" height="14" rx="4"/>
    <rect x="631" y="212" width="30" height="9" rx="4"/>
    <rect x="679" y="216" width="30" height="12" rx="4"/>
  </g>
  <circle cx="662" cy="206" r="9" fill="#f87171" opacity="0.85"/>
  <rect x="439" y="228" width="294" height="14" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="736" y="268" text-anchor="end" font-size="12" fill="#64748b">стол</text>

  <!-- сопло слишком высоко -->
  <rect x="551" y="160" width="28" height="14" rx="4" fill="#94a3b8"/>
  <path d="M557 174h16l-5 16h-6z" fill="#cbd5e1"/>
  <path d="M566 194 L566 206" stroke="#fbbf24" stroke-width="3"/>
  <path d="M560 204 L566 196 L572 204" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="590" y="196" font-size="12" fill="#fbbf24">сопло слишком высоко</text>

  <g font-size="14" fill="#fecaca">
    <text x="439" y="320">• между линиями щели</text>
    <text x="439" y="346">• пластик не прилип к столу</text>
    <text x="439" y="372">• слышны бугры и наплывы</text>
  </g>
</svg>
