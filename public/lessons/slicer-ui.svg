<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- окно программы -->
  <rect x="40" y="28" width="720" height="394" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <path d="M40 46a18 18 0 0 1 18-18h684a18 18 0 0 1 18 18v26H40z" fill="#111c33"/>
  <text x="70" y="60" font-size="14" fill="#cbd5e1">Cura — предпросмотр печати</text>
  <g>
    <circle cx="706" cy="46" r="5" fill="#f87171"/>
    <circle cx="724" cy="46" r="5" fill="#fbbf24"/>
    <circle cx="742" cy="46" r="5" fill="#34d399"/>
  </g>

  <!-- панель настроек -->
  <rect x="58" y="88" width="192" height="312" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="74" y="114" font-size="11" letter-spacing="1.5" fill="#64748b">ПАНЕЛЬ НАСТРОЕК</text>

  <g font-size="13" fill="#cbd5e1">
    <text x="74" y="146">Высота слоя</text>
    <text x="234" y="146" text-anchor="end" fill="#38bdf8">0,2 мм</text>
    <rect x="74" y="154" width="160" height="6" rx="3" fill="#1e293b"/>
    <circle cx="106" cy="157" r="6" fill="#3b82f6"/>

    <text x="74" y="186">Заполнение</text>
    <text x="234" y="186" text-anchor="end" fill="#38bdf8">20 %</text>
    <rect x="74" y="194" width="160" height="6" rx="3" fill="#1e293b"/>
    <circle cx="106" cy="197" r="6" fill="#3b82f6"/>

    <text x="74" y="226">Поддержки</text>
    <text x="234" y="226" text-anchor="end" fill="#94a3b8">выкл</text>
    <rect x="74" y="234" width="160" height="6" rx="3" fill="#1e293b"/>
    <circle cx="82" cy="237" r="6" fill="#475569"/>

    <text x="74" y="266">Температура</text>
    <text x="234" y="266" text-anchor="end" fill="#38bdf8">210 °C</text>
    <rect x="74" y="274" width="160" height="6" rx="3" fill="#1e293b"/>
    <circle cx="136" cy="277" r="6" fill="#3b82f6"/>

    <text x="74" y="306">Скорость</text>
    <text x="234" y="306" text-anchor="end" fill="#38bdf8">50 мм/с</text>
    <rect x="74" y="314" width="160" height="6" rx="3" fill="#1e293b"/>
    <circle cx="122" cy="317" r="6" fill="#3b82f6"/>
  </g>
  <text x="74" y="366" font-size="11" fill="#64748b">Профиль: PLA 0.2 мм</text>

  <!-- рабочая область со столом -->
  <polygon points="286,300 606,300 664,238 344,238" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <g stroke="#334155" stroke-width="1" opacity="0.7">
    <path d="M350 300 L408 238M414 300 L472 238M478 300 L536 238M542 300 L600 238"/>
    <path d="M330 276 L620 276M318 262 L646 262M346 290 L634 290"/>
  </g>
  <rect x="486" y="238" width="4" height="62" fill="#0ea5e9" opacity="0.7"/>

  <!-- модель на столе -->
  <path d="M436 274 C436 254 456 252 456 234 L456 224 L474 224 L474 234 C474 252 494 254 494 274 Z" fill="url(#model)"/>
  <ellipse cx="465" cy="274" rx="30" ry="7" fill="#0b1220" opacity="0.6"/>

  <text x="472" y="330" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#64748b">РАБОЧАЯ ОБЛАСТЬ</text>

  <!-- кнопки -->
  <rect x="612" y="96" width="130" height="42" rx="12" fill="#2563eb"/>
  <text x="677" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Нарезать</text>
  <rect x="612" y="150" width="130" height="38" rx="12" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="677" y="175" text-anchor="middle" font-size="13" fill="#cbd5e1">Экспорт STL</text>

  <g font-size="12" fill="#64748b">
    <text x="677" y="216" text-anchor="middle">Слой 0,2 мм</text>
    <text x="677" y="236" text-anchor="middle">Стенок: 3</text>
    <text x="677" y="256" text-anchor="middle">Время: 1 ч 40 м</text>
  </g>
</svg>
