<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- быстро -->
  <rect x="40" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#f87171" stroke-width="2"/>
  <rect x="64" y="64" width="118" height="32" rx="16" fill="#f87171" opacity="0.18"/>
  <text x="123" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#f87171">80 мм/с</text>
  <text x="64" y="126" font-size="15" fill="#cbd5e1">слишком быстро</text>

  <rect x="96" y="176" width="230" height="150" rx="26" fill="#f87171" opacity="0.85"/>
  <g stroke="#070c17" stroke-width="2" opacity="0.5">
    <path d="M96 208 C150 202 240 214 326 206"/>
    <path d="M96 236 C160 242 250 230 326 238"/>
    <path d="M96 264 C150 258 250 268 326 258"/>
    <path d="M96 292 C160 298 246 288 326 296"/>
  </g>
  <g fill="#070c17" opacity="0.28">
    <circle cx="140" cy="222" r="3"/>
    <circle cx="196" cy="250" r="3.4"/>
    <circle cx="258" cy="284" r="3"/>
    <circle cx="300" cy="196" r="3"/>
  </g>

  <g font-size="13" fill="#fecaca">
    <text x="64" y="360">• углы закруглены</text>
    <text x="64" y="382">• слои плохо склеены</text>
    <text x="64" y="404">• поверхность шершавая</text>
  </g>

  <!-- медленно -->
  <rect x="415" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#10b981" stroke-width="2"/>
  <rect x="439" y="64" width="118" height="32" rx="16" fill="#34d399" opacity="0.18"/>
  <text x="498" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#34d399">40 мм/с</text>
  <text x="439" y="126" font-size="15" fill="#cbd5e1">спокойная скорость</text>

  <rect x="471" y="176" width="230" height="150" rx="8" fill="#34d399" opacity="0.85"/>
  <g stroke="#070c17" stroke-width="2" opacity="0.4">
    <path d="M471 208h230M471 236h230M471 264h230M471 292h230"/>
  </g>

  <g font-size="13" fill="#a7f3d0">
    <text x="439" y="360">• поверхность гладкая</text>
    <text x="439" y="382">• углы чёткие</text>
    <text x="439" y="404">• слои прочно склеены</text>
  </g>
</svg>
