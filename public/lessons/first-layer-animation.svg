<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="64" y="72" font-size="17" font-weight="bold" fill="#e2e8f0">Формирование первого слоя</text>
  <text x="64" y="100" font-size="13" fill="#94a3b8">сопло движется слева направо и выдавливает пластик</text>

  <!-- стол -->
  <rect x="80" y="332" width="640" height="16" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="86" y="329" width="628" height="5" rx="2.5" fill="#3b82f6" opacity="0.7"/>

  <!-- растущий слой -->
  <rect x="120" y="318" width="0" height="11" rx="3" fill="#38bdf8">
    <animate attributeName="width" values="0;566;566;0" keyTimes="0;0.85;1;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- сопло -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 566 0; 566 0; 0 0" keyTimes="0;0.85;1;1" dur="4s" repeatCount="indefinite"/>
    <rect x="106" y="284" width="28" height="14" rx="4" fill="#94a3b8"/>
    <path d="M112 298h16l-5 16h-6z" fill="#cbd5e1"/>
    <circle cx="120" cy="320" r="13" fill="#f59e0b" opacity="0.25"/>
    <circle cx="120" cy="322" r="6" fill="#fbbf24">
      <animate attributeName="opacity" values="0.95;0.35;0.95" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- размер слоя -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M742 318 L742 329"/>
    <path d="M736 321 L742 318 L748 321"/>
    <path d="M736 326 L742 329 L748 326"/>
  </g>
  <text x="756" y="326" font-size="11" fill="#64748b">слой</text>

  <!-- пояснение -->
  <g font-size="13" fill="#94a3b8">
    <text x="80" y="404">Толщина слоя для старта — 0,2 мм: линии ложатся рядом и слегка сплавляются,</text>
    <text x="80" y="426">поэтому модель не расслаивается на следующих слоях</text>
  </g>
</svg>
