<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="36" y="70" font-size="17" font-weight="bold" fill="#e2e8f0">Где брать готовые модели</text>

  <!-- Thingiverse -->
  <rect x="36" y="100" width="170" height="210" rx="16" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <rect x="89" y="122" width="64" height="64" rx="16" fill="#3b82f6"/>
  <text x="121" y="166" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">T</text>
  <text x="121" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">Thingiverse</text>
  <text x="121" y="248" text-anchor="middle" font-size="12" fill="#94a3b8">много бесплатных</text>
  <text x="121" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">моделей</text>
  <text x="121" y="292" text-anchor="middle" font-size="12" fill="#64748b">нужен аккаунт</text>

  <!-- Printables -->
  <rect x="222" y="100" width="170" height="210" rx="16" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <rect x="275" y="122" width="64" height="64" rx="16" fill="#22c55e"/>
  <text x="307" y="166" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">P</text>
  <text x="307" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">Printables</text>
  <text x="307" y="248" text-anchor="middle" font-size="12" fill="#94a3b8">удобный поиск</text>
  <text x="307" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">и рейтинги</text>
  <text x="307" y="292" text-anchor="middle" font-size="12" fill="#64748b">много профилей</text>

  <!-- Cults3D -->
  <rect x="408" y="100" width="170" height="210" rx="16" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <rect x="461" y="122" width="64" height="64" rx="16" fill="#f97316"/>
  <text x="493" y="166" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">C</text>
  <text x="493" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">Cults3D</text>
  <text x="493" y="248" text-anchor="middle" font-size="12" fill="#94a3b8">есть платные</text>
  <text x="493" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">дизайны</text>
  <text x="493" y="292" text-anchor="middle" font-size="12" fill="#64748b">качество высокое</text>

  <!-- MakerWorld -->
  <rect x="594" y="100" width="170" height="210" rx="16" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <rect x="647" y="122" width="64" height="64" rx="16" fill="#ef4444"/>
  <text x="679" y="166" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">M</text>
  <text x="679" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">MakerWorld</text>
  <text x="679" y="248" text-anchor="middle" font-size="12" fill="#94a3b8">база моделей</text>
  <text x="679" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">от производителя</text>
  <text x="679" y="292" text-anchor="middle" font-size="12" fill="#64748b">готовые профили</text>

  <text x="36" y="352" font-size="14" fill="#cbd5e1">Проверяй перед скачиванием: принтер автора, поддержки, инструкцию и комментарии.</text>
  <text x="36" y="380" font-size="13" fill="#64748b">Скачивай STL или 3MF, смотри фото других печатников и уважай лицензии авторов.</text>
</svg>
