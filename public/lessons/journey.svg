<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- дорога -->
  <path d="M60 412 C180 400 210 358 268 340 C330 322 350 312 416 300 C490 288 500 258 556 236 C612 214 630 176 686 148 C712 136 728 124 742 110"
        fill="none" stroke="#1e293b" stroke-width="44" stroke-linecap="round"/>
  <path d="M60 412 C180 400 210 358 268 340 C330 322 350 312 416 300 C490 288 500 258 556 236 C612 214 630 176 686 148 C712 136 728 124 742 110"
        fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="14 14"/>

  <!-- этапы -->
  <g>
    <circle cx="120" cy="392" r="22" fill="#2563eb"/>
    <text x="120" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1</text>
    <text x="120" y="436" text-anchor="middle" font-size="13" fill="#cbd5e1">включил принтер</text>

    <circle cx="268" cy="340" r="22" fill="#2563eb"/>
    <text x="268" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
    <text x="268" y="384" text-anchor="middle" font-size="13" fill="#cbd5e1">выбрал пластик</text>

    <circle cx="416" cy="300" r="22" fill="#2563eb"/>
    <text x="416" y="307" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
    <text x="416" y="266" text-anchor="middle" font-size="13" fill="#cbd5e1">настроил слайсер</text>

    <circle cx="556" cy="236" r="22" fill="#2563eb"/>
    <text x="556" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
    <text x="596" y="288" text-anchor="middle" font-size="13" fill="#cbd5e1">исправил дефекты</text>

    <circle cx="686" cy="148" r="22" fill="#2563eb"/>
    <text x="686" y="155" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">5</text>
    <text x="660" y="204" text-anchor="middle" font-size="13" fill="#cbd5e1">сделал свою модель</text>
  </g>

  <!-- флаг -->
  <path d="M742 112 L742 62" stroke="#94a3b8" stroke-width="3"/>
  <path d="M742 64 h46 l-11 11 11 11 h-46 z" fill="#f59e0b"/>
  <text x="792" y="56" text-anchor="end" font-size="14" font-weight="bold" fill="#fbbf24">Ты здесь</text>

  <text x="40" y="40" font-size="14" fill="#94a3b8">Пять этапов курса — и ты уже печатаешь собственные модели</text>
</svg>
