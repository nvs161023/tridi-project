<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- PLA -->
  <rect x="40" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="64" y="86" font-size="24" font-weight="bold" fill="#38bdf8">PLA</text>
  <text x="64" y="110" font-size="13" fill="#64748b">профиль для старта</text>

  <text x="64" y="152" font-size="14" fill="#cbd5e1">Сопло (Nozzle)</text>
  <text x="361" y="152" text-anchor="end" font-size="17" font-weight="bold" fill="#f59e0b">210 °C</text>
  <rect x="64" y="166" width="297" height="14" rx="7" fill="#1e293b"/>
  <rect x="138" y="162" width="74" height="22" rx="7" fill="#38bdf8" opacity="0.18"/>
