  <rect x="528" y="272" width="59" height="22" rx="7" fill="#38bdf8" opacity="0.18"/>
  <rect x="439" y="276" width="148" height="14" rx="7" fill="#38bdf8"/>
  <circle cx="587" cy="283" r="8" fill="#7dd3fc" stroke="#0b1220" stroke-width="3"/>
  <text x="439" y="314" font-size="11" fill="#64748b">60 °C</text>
  <text x="736" y="314" text-anchor="end" font-size="11" fill="#64748b">100 °C</text>

  <text x="439" y="360" font-size="12" fill="#64748b">Меняй температуру на 5 °C</text>
