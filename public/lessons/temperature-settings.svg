  <circle cx="183" cy="283" r="8" fill="#7dd3fc" stroke="#0b1220" stroke-width="3"/>
  <text x="64" y="314" font-size="11" fill="#64748b">40 °C</text>
  <text x="361" y="314" text-anchor="end" font-size="11" fill="#64748b">90 °C</text>

  <text x="64" y="360" font-size="12" fill="#64748b">Голубая зона — рекомендуемый</text>
  <text x="64" y="380" font-size="12" fill="#64748b">диапазон для этого пластика</text>

  <!-- PETG -->
  <rect x="415" y="40" width="345" height="370" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="439" y="86" font-size="24" font-weight="bold" fill="#34d399">PETG</text>
  <text x="439" y="110" font-size="13" fill="#64748b">прочнее и термостойчее</text>

  <text x="439" y="152" font-size="14" fill="#cbd5e1">Сопло (Nozzle)</text>
  <text x="736" y="152" text-anchor="end" font-size="17" font-weight="bold" fill="#f59e0b">240 °C</text>
  <rect x="439" y="166" width="297" height="14" rx="7" fill="#1e293b"/>
  <rect x="484" y="162" width="74" height="22" rx="7" fill="#38bdf8" opacity="0.18"/>
  <rect x="439" y="166" width="119" height="14" rx="7" fill="#f59e0b"/>
  <circle cx="558" cy="173" r="8" fill="#fbbf24" stroke="#0b1220" stroke-width="3"/>
  <text x="439" y="204" font-size="11" fill="#64748b">220 °C</text>
  <text x="736" y="204" text-anchor="end" font-size="11" fill="#64748b">270 °C</text>

