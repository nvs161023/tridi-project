<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- мало -->
  <rect x="40" y="40" width="228" height="370" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="64" y="86" font-size="19" font-weight="bold" fill="#f59e0b">Поток 90 %</text>
  <g fill="#f59e0b">
    <rect x="62" y="150" width="14" height="140" rx="3"/>
    <rect x="86" y="150" width="14" height="140" rx="3"/>
    <rect x="110" y="150" width="14" height="140" rx="3"/>
    <rect x="134" y="150" width="14" height="140" rx="3"/>
    <rect x="158" y="150" width="14" height="140" rx="3"/>
    <rect x="182" y="150" width="14" height="140" rx="3"/>
    <rect x="206" y="150" width="14" height="140" rx="3"/>
    <rect x="230" y="150" width="14" height="140" rx="3"/>
  </g>
  <rect x="56" y="290" width="196" height="14" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="154" y="340" text-anchor="middle" font-size="13" fill="#fdba74">щели между линиями,</text>
  <text x="154" y="360" text-anchor="middle" font-size="13" fill="#fdba74">стенки рыхлые</text>

  <!-- норма -->
  <rect x="286" y="40" width="228" height="370" rx="18" fill="#111c33" stroke="#10b981" stroke-width="2"/>
  <text x="310" y="86" font-size="19" font-weight="bold" fill="#34d399">Поток 100 %</text>
  <g fill="#34d399">
    <rect x="308" y="150" width="24" height="140" rx="3"/>
    <rect x="332" y="150" width="24" height="140" rx="3"/>
    <rect x="356" y="150" width="24" height="140" rx="3"/>
    <rect x="380" y="150" width="24" height="140" rx="3"/>
    <rect x="404" y="150" width="24" height="140" rx="3"/>
    <rect x="428" y="150" width="24" height="140" rx="3"/>
    <rect x="452" y="150" width="24" height="140" rx="3"/>
  </g>
  <g stroke="#0b1220" stroke-width="1.4" opacity="0.3">
    <path d="M332 150v140M356 150v140M380 150v140M404 150v140M428 150v140"/>
  </g>
  <rect x="302" y="290" width="196" height="14" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#a7f3d0">линии ровные и плотные,</text>
  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#a7f3d0">без щелей и наплывов</text>

  <!-- много -->
  <rect x="532" y="40" width="228" height="370" rx="18" fill="#111c33" stroke="#f87171" stroke-width="2"/>
  <text x="556" y="86" font-size="19" font-weight="bold" fill="#f87171">Поток 110 %</text>
  <g fill="#f87171">
    <rect x="552" y="150" width="70" height="140" rx="14"/>
    <rect x="608" y="150" width="70" height="140" rx="14"/>
    <rect x="664" y="150" width="70" height="140" rx="14"/>
  </g>
  <g fill="#f87171" opacity="0.9">
    <circle cx="582" cy="168" r="10"/>
    <circle cx="638" cy="176" r="12"/>
    <circle cx="694" cy="164" r="9"/>
  </g>
  <rect x="548" y="290" width="196" height="14" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="646" y="340" text-anchor="middle" font-size="13" fill="#fecaca">бугры, волны и лишний</text>
  <text x="646" y="360" text-anchor="middle" font-size="13" fill="#fecaca">пластик по краям</text>

  <text x="400" y="436" text-anchor="middle" font-size="13" fill="#64748b">Поток меняют шагами по 2–3 %, печатают один и тот же тест и сравнивают</text>
</svg>
