name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, build and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Build prerender-ит публичные страницы и создаёт Supabase-клиент. Это
      # публичные фиктивные значения только для сборки: секреты и .env.local
      # пайплайну не нужны, а запросы к базе на этом шаге не выполняются.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Credits rules
        run: npm run check:credits

      - name: Billing access rules
        run: npm run check:billing

      - name: Subscription renewal race
        run: npm run check:subscription

      - name: Project docs sync
        run: npm run check:docs
