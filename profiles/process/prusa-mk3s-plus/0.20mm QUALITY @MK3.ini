# Source: https://github.com/prusa3d/PrusaSlicer-settings-prusa-fff
# Commit: c712aaf177a915da19acad20262ab9379010b3aa
# Bundle: PrusaResearch/2.5.12.ini
# Section: [print:0.20mm QUALITY @MK3]
# PrusaSlicer inheritance (inherits = ...) is kept exactly as in the source bundle.
# See profiles/SOURCES.md for provenance and license notes.
[print:0.20mm QUALITY @MK3]
inherits = *0.20mm*; *MK3*
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_notes=~/.*PRINTER_MODEL_MK3.*/ and nozzle_diameter[0]==0.4 and printer_model!="MK3.5MMU3"
external_perimeter_speed = 25
infill_acceleration = 1000
infill_speed = 80
max_print_speed = 200
perimeter_speed = 45
solid_infill_speed = 80
top_solid_infill_speed = 40
fill_pattern = gyroid
fill_density = 15%
