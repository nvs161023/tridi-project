meta:
  environment: node
  toolchain:
    name: npm
    version: 22
build:
  additionalCommands: npm run build:amvera
  # Блок artifacts из конфига убран: маски-исключения (`!.next/cache`) платформа
  # игнорировала («No files matched the pattern»), и в архив всё равно уезжал
  # весь .next вместе с кешем — 809 МБ. Размер ограничивает сама сборка:
  # в режиме standalone (next.config.ts) весь рантайм лежит в .next/standalone,
  # это ~80 МБ, а кеш сборки туда не попадает.
run:
  # standalone-сервер из своей папки: node_modules проекта в рантайме не нужны.
  scriptName: .next/standalone/server.js
  scriptArguments: ""
  containerPort: 3000
